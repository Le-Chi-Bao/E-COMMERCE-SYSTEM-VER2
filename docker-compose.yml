services:
  app:
    build: .
    ports:
      - "8866:8866"
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: "120906"
      DB_NAME: mini_ecommerce
    # Thêm healthcheck và restart policy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7862"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "120906"
      MYSQL_DATABASE: mini_ecommerce
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: